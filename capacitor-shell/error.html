<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio Estate</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.22), transparent 36%),
          linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(440px, calc(100vw - 32px));
        padding: 28px 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 14px;
        font-size: 16px;
        line-height: 1.5;
      }

      code {
        font-size: 14px;
        background: #e2e8f0;
        padding: 2px 6px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Studio Estate could not load</h1>
      <p>The iOS shell could not reach the hosted app.</p>
      <p>Check <code>CAPACITOR_SERVER_URL</code> or <code>NEXT_PUBLIC_SITE_URL</code> and try again.</p>
    </main>
  </body>
</html>
